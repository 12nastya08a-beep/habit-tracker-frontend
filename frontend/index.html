<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HabitTracker — Головна</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #e9ecef; padding-bottom: 15px;">
            <div>
                <button type="button" onclick="location.href='index.html'" style="width: auto; padding: 8px 15px; margin-right: 5px;">Головна</button>
                <button type="button" onclick="location.href='dashboard.html'" style="width: auto; padding: 8px 15px; background-color: #2ecc71;">Мої звички</button>
            </div>
            <div id="nav-auth-section"></div>
        </nav>

        <h2>Ласкаво просимо до HabitTracker!</h2>
        <p>Інформаційна платформа для відстеження щоденних звичок та досягнення цілей.</p>
        <div style="background: #fdfdfe; border: 1px solid #e9ecef; padding: 20px; border-radius: 8px; text-align: center;">
            <p style="margin-bottom: 15px;">Для керування власними звичками увійдіть у систему або зареєструйтеся.</p>
            <button type="button" onclick="location.href='login.html'" style="width: auto; padding: 10px 20px; margin-right: 10px;">Увійти</button>
            <button type="button" onclick="location.href='register.html'" style="width: auto; padding: 10px 20px; background-color: #2ecc71;">Реєстрація</button>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initNavbar();
        });
    </script>
</body>
</html>
