<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HabitTracker — Логін</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #e9ecef; padding-bottom: 15px;">
            <div>
                <button type="button" onclick="location.href='index.html'" style="width: auto; padding: 8px 15px; margin-right: 5px;">Головна</button>
                <button type="button" onclick="location.href='dashboard.html'" style="width: auto; padding: 8px 15px; background-color: #2ecc71;">Мої звички</button>
            </div>
            <div id="nav-auth-section"></div>
        </nav>

        <h2>Вхід у систему</h2>
        <p>Увійдіть для доступу до керування звичками.</p>
        <form id="login-form">
            <div style="margin-bottom: 15px;">
                <label for="login-username" style="display: block; margin-bottom: 5px; font-size: 14px; color: #555;">Користувач</label>
                <input type="text" id="login-username" placeholder="Username" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label for="login-password" style="display: block; margin-bottom: 5px; font-size: 14px; color: #555;">Пароль</label>
                <input type="password" id="login-password" placeholder="Пароль" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
            </div>
            <button type="submit">Увійти</button>
        </form>
        <p style="text-align: center; margin-top: 15px;">Немає акаунта? <button type="button" onclick="location.href='register.html'" style="background: none; color: #3498db; width: auto; padding: 0; display: inline; cursor: pointer;">Реєстрація</button></p>
    </div>

    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('access')) {
                window.location.href = 'dashboard.html';
                return;
            }
            initNavbar();
            document.getElementById('login-form').addEventListener('submit', handleLogin);
        });

        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch(`${API_BASE}/auth/login/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('access', data.access);
                    localStorage.setItem('refresh', data.refresh);
                    localStorage.setItem('username', username);

                    const redirectUrl = localStorage.getItem('redirectAfterLogin') || 'dashboard.html';
                    localStorage.removeItem('redirectAfterLogin');
                    window.location.href = redirectUrl;
                } else {
                    alert('Помилка входу! Перевірте логін та пароль.');
                }
            } catch (e) {
                console.error(e);
                alert('Помилка зʼєднання з сервером.');
            }
        }
    </script>
</body>
</html>
