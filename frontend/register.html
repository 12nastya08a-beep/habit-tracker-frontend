<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HabitTracker — Реєстрація</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #e9ecef; padding-bottom: 15px;">
            <div>
                <button type="button" onclick="location.href='index.html'" style="width: auto; padding: 8px 15px; margin-right: 5px;">Головна</button>
                <button type="button" onclick="location.href='dashboard.html'" style="width: auto; padding: 8px 15px; background-color: #2ecc71;">Мої звички</button>
            </div>
            <div id="nav-auth-section"></div>
        </nav>

        <h2>Реєстрація</h2>
        <p>Створіть новий обліковий запис у системі.</p>
        <form id="register-form">
            <div style="margin-bottom: 15px;">
                <label for="reg-username" style="display: block; margin-bottom: 5px; font-size: 14px; color: #555;">Користувач</label>
                <input type="text" id="reg-username" placeholder="Username" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label for="reg-email" style="display: block; margin-bottom: 5px; font-size: 14px; color: #555;">Email</label>
                <input type="email" id="reg-email" placeholder="Email" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label for="reg-firstname" style="display: block; margin-bottom: 5px; font-size: 14px; color: #555;">Ім'я</label>
                <input type="text" id="reg-firstname" placeholder="Ім'я" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label for="reg-lastname" style="display: block; margin-bottom: 5px; font-size: 14px; color: #555;">Прізвище</label>
                <input type="text" id="reg-lastname" placeholder="Прізвище" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label for="reg-password" style="display: block; margin-bottom: 5px; font-size: 14px; color: #555;">Пароль</label>
                <input type="password" id="reg-password" placeholder="Пароль" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label for="reg-password-confirm" style="display: block; margin-bottom: 5px; font-size: 14px; color: #555;">Підтвердження пароля</label>
                <input type="password" id="reg-password-confirm" placeholder="Підтвердження пароля" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
            </div>
            <button type="submit">Зареєструватися</button>
        </form>
        <p style="text-align: center; margin-top: 15px;">Вже є акаунт? <button type="button" onclick="location.href='login.html'" style="background: none; color: #3498db; width: auto; padding: 0; display: inline; cursor: pointer;">Увійти</button></p>
    </div>

    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('access')) {
                window.location.href = 'dashboard.html';
                return;
            }
            initNavbar();
            document.getElementById('register-form').addEventListener('submit', handleRegister);
        });

        async function handleRegister(event) {
            event.preventDefault();
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const first_name = document.getElementById('reg-firstname').value;
            const last_name = document.getElementById('reg-lastname').value;
            const password = document.getElementById('reg-password').value;
            const password_confirmation = document.getElementById('reg-password-confirm').value;

            try {
                const res = await fetch(`${API_BASE}/auth/register/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, first_name, last_name, password, password_confirmation })
                });

                if (res.ok) {
                    alert('Реєстрація успішна!');
                    window.location.href = 'login.html';
                } else {
                    const errData = await res.json();
                    alert('Помилка реєстрації: ' + JSON.stringify(errData));
                }
            } catch (error) {
                console.error(error);
                alert('Не вдалося зʼєднатися з сервером.');
            }
        }
    </script>
</body>
</html>
